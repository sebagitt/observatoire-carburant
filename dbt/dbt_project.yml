name: 'observatoire_carburant'
version: '1.0.0'
config-version: 2

# Profil versionné dans dbt/profiles.yml (uniquement des env_var) ; DBT_PROFILES_DIR est posé par make dbt.
profile: 'observatoire_carburant'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Millésimes des référentiels lus en staging (COG 2026, Filosofi 2023).
# Bornes de prix plausibles en euros par litre, incluses (test prix_eur_litre_plausible du staging).
# Mart quotidien : écart maximal entre les passages qui encadrent midi de Paris, âge maximal du prix en vigueur (J9 F5, F8).
vars:
  cog_millesime: 2026
  filosofi_millesime: 2023
  prix_plausible_min: 0.5
  prix_plausible_max: 3.5
  ecart_midi_max_minutes: 30
  prix_age_max_jours: 90

flags:
  send_anonymous_usage_stats: false

# Schémas : la macro generate_schema_name utilise le schéma personnalisé tel quel.
# Staging et intermediate dans carburant_silver ; marts plus tard dans carburant_gold.
# Les schémas bronze, silver, gold, ci_* et default appartiennent à un autre projet : jamais utilisés (garde pytest).
models:
  observatoire_carburant:
    +group: carburants
    staging:
      +schema: carburant_silver
      +materialized: view
      +access: private
    intermediate:
      +schema: carburant_silver
      +materialized: view
      +access: protected
    marts:
      +schema: carburant_gold
      +materialized: table
      +access: protected

# Par défaut, les tests ont le schéma personnalisé dbt_test__audit (lignes en échec si store_failures) :
# avec la macro, ce serait workspace.dbt_test__audit, hors carburant_*. Rattachés à carburant_silver.
data_tests:
  observatoire_carburant:
    +schema: carburant_silver
