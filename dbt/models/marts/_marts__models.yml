version: 2

models:
  - name: dim_commune
    description: >
      Une ligne par commune (COM) ou arrondissement municipal (ARM) du COG var('cog_millesime') ; COMA et COMD exclus
      (ils se rattachent à leur parent). Filosofi var('filosofi_millesime') joint sur (geo_object = commune_type,
      codgeo = commune_code) : sans ligne Filosofi ou valeur masquée, la valeur reste NULL (pas de table de mouvements).
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: commune_code
        data_type: string
        constraints:
          - type: not_null
        data_tests: [unique, not_null]
      - name: commune_type
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [COM, ARM]
      - name: commune_nom
        data_type: string
        data_tests: [not_null]
      - name: commune_parent_code
        data_type: string
        description: comparent pour un ARM, le code lui-même pour un COM.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commune')
                field: commune_code
      - name: departement_code
        data_type: string
        description: Mesure du 17/11 avant écriture, 0 COM ou ARM sans département ; not_null ajouté.
        data_tests: [not_null]
      - name: departement_nom
        data_type: string
      - name: region_code
        data_type: string
      - name: region_nom
        data_type: string
      - name: niveau_vie_median_eur
        data_type: double
        description: Filosofi med_sl, euros par an ; NULL si masqué ou sans ligne Filosofi (107 COM, fiche filosofi, piège 4).
      - name: niveau_vie_median_statut
        data_type: string
        description: Filosofi med_sl_statut (C, confidentiel).
      - name: taux_pauvrete_pct
        data_type: double
        description: Filosofi pr_md60, taux de pauvreté au seuil de 60 %, en pourcentage.
      - name: taux_pauvrete_statut
        data_type: string
        description: Filosofi pr_md60_statut.
      - name: filosofi_millesime
        data_type: int
        description: Millésime de la ligne Filosofi jointe ; NULL sans ligne Filosofi.
      - name: cog_millesime
        data_type: int

  - name: dim_station
    description: >
      SCD2 des attributs descriptifs des stations, une ligne par station et par version des attributs suivis (D5 de J7),
      reconstruite à chaque build depuis le journal des versions (stg_carburants__station_etats, îlots), sans dbt snapshot.
      Ruptures, horaires et carburants disponibles ne créent pas de version. Intervalles semi-ouverts
      [debut_validite_ts, fin_validite_ts[.
    data_tests:
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: debut_validite_ts
            upper_bound_column: "coalesce(fin_validite_ts, timestamp '9999-12-31')"
            partition_by: station_id
            gaps: not_allowed
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: station_version_id
        data_type: string
        constraints:
          - type: not_null
        description: Clé de substitution (station_id, debut_validite_ts).
        data_tests: [unique, not_null]
      - name: station_id
        data_type: bigint
        constraints:
          - type: not_null
        data_tests: [not_null]
      - name: version_num
        data_type: bigint
        description: Numéro de version de la station, 1 pour la plus ancienne.
      - name: services
        data_type: array<string>
        description: services_service de la source en tableau trié (D6) ; l'ordre de la source ne crée pas de version.
      - name: debut_validite_ts
        data_type: timestamp
        constraints:
          - type: not_null
        description: >
          Première observation de la version par la collecte (D8), pas l'heure réelle du changement : la collecte
          passe toutes les 15 minutes et s'arrête avec le poste.
        data_tests: [not_null]
      - name: fin_validite_ts
        data_type: timestamp
        description: Début de la version suivante ; NULL pour la dernière version connue.
      - name: est_courante
        data_type: boolean
        description: Dernière version connue (D9), pas « station ouverte » ; une station disparue du flux garde sa version courante.
      - name: charge_ts
        data_type: timestamp
        description: Heure de chargement au bronze de la ligne d'origine de la version.
      - name: adresse
        data_type: string
      - name: code_postal
        data_type: string
      - name: ville
        data_type: string
      - name: code_departement
        data_type: string
      - name: departement_nom
        data_type: string
      - name: code_region
        data_type: string
      - name: region_nom
        data_type: string
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: type_route_code
        data_type: string
      - name: automate_24_24
        data_type: boolean

  - name: fct_ruptures
    description: >
      Une ligne par événement de rupture (station, carburant, rupture_debut_ts), reconstruit depuis le journal des
      versions. Fin observée au quart d'heure près (première version de la station sans l'événement), sauf pendant
      les trous de collecte ; commune depuis int_stations__commune.
    config:
      access: public
      contract:
        enforced: true
    columns:
      - name: rupture_id
        data_type: string
        constraints:
          - type: not_null
        description: Clé de substitution (station_id, carburant, rupture_debut_ts).
        data_tests: [unique, not_null]
      - name: station_id
        data_type: bigint
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: carburant
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [e10, e85, gazole, gplc, sp95, sp98]
      - name: rupture_debut_ts
        data_type: timestamp
        constraints:
          - type: not_null
        description: Début annoncé par la source, en UTC (heure de Paris convertie, voir le staging).
        data_tests: [not_null]
      - name: rupture_type
        data_type: string
        description: Dernier type observé (definitive ou temporaire) ; un seul type par événement attendu (test en warn).
      - name: premiere_observation_ts
        data_type: timestamp
        constraints:
          - type: not_null
        description: Première version de la station où l'événement est vu.
      - name: derniere_observation_ts
        data_type: timestamp
        description: Dernière version de la station où l'événement est vu.
      - name: fin_observee_ts
        data_type: timestamp
        description: >
          collecte_ts de la première version de la station postérieure à derniere_observation_ts (l'événement y a
          disparu) ; NULL si l'événement est présent dans la dernière version.
      - name: est_en_cours
        data_type: boolean
        description: Vrai si l'événement est présent dans la dernière version connue de la station (fin NULL).
      - name: commune_code
        data_type: string
        description: Commune de la station (int_stations__commune) ; NULL si la station n'est pas rattachée.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_commune')
                field: commune_code

  - name: fct_prix
    description: >
      Une ligne par version de prix (station, carburant, prix_maj_ts). Intervalles semi-ouverts
      [valide_depuis_ts, valide_jusqu_ts[ par station et carburant ; prix hors bornes gardés avec est_plausible faux ;
      commune depuis int_stations__commune.
    config:
      access: public
      contract:
        enforced: true
    data_tests:
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: valide_depuis_ts
            upper_bound_column: "coalesce(valide_jusqu_ts, timestamp '9999-12-31')"
            partition_by: station_id, carburant
            gaps: not_allowed
      - dbt_utils.expression_is_true:
          name: fct_prix_valide_depuis_avant_premiere_observation
          arguments:
            expression: "valide_depuis_ts <= premiere_observation_ts"
          config:
            severity: error
    columns:
      - name: prix_version_id
        data_type: string
        constraints:
          - type: not_null
        description: Clé de substitution (station_id, carburant, prix_maj_ts).
        data_tests: [unique, not_null]
      - name: station_id
        data_type: bigint
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: carburant
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [gazole, e10, sp98, e85, sp95, gplc]
      - name: prix_eur_litre
        data_type: decimal(6,3)
        description: Prix en euros par litre.
      - name: valide_depuis_ts
        data_type: timestamp
        constraints:
          - type: not_null
        description: prix_maj_ts de la version, en UTC.
        data_tests: [not_null]
      - name: valide_jusqu_ts
        data_type: timestamp
        description: prix_maj_ts de la version suivante du même couple (station, carburant) ; NULL pour la dernière.
      - name: est_courant
        data_type: boolean
        description: Vrai pour la dernière version connue du couple (station, carburant).
      - name: est_plausible
        data_type: boolean
        description: Vrai si le prix est entre les variables prix_plausible_min et prix_plausible_max, bornes incluses.
      - name: premiere_observation_ts
        data_type: timestamp
        constraints:
          - type: not_null
        description: collecte_ts de la version (premier passage de collecte qui l'a vue).
      - name: commune_code
        data_type: string
        description: Commune de la station (int_stations__commune) ; NULL si la station n'est pas rattachée.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_commune')
                field: commune_code

unit_tests:
  - name: test_dim_commune_parent_arm_et_com
    description: un ARM reçoit son code parent (comparent), un COM se reçoit lui-même.
    model: dim_commune
    given:
      - input: ref('stg_insee__cog_communes')
        rows:
          - {cog_millesime: 2026, commune_code: "75056", commune_type: COM, commune_parent_code: null, commune_nom: "Paris", departement_code: "75", region_code: "11"}
          - {cog_millesime: 2026, commune_code: "75101", commune_type: ARM, commune_parent_code: "75056", commune_nom: "Paris 1er Arrondissement", departement_code: "75", region_code: "11"}
      - input: ref('stg_insee__cog_departements')
        rows:
          - {departement_code: "75", departement_nom: "Paris", region_code: "11"}
      - input: ref('stg_insee__cog_regions')
        rows:
          - {region_code: "11", region_nom: "Île-de-France"}
      - input: ref('stg_insee__filosofi_communes')
        rows:
          - {filosofi_millesime: 2023, geo_object: ARM, commune_code: "75101", med_sl: 40000.0, med_sl_statut: A}
    expect:
      rows:
        - {commune_code: "75056", commune_type: COM, commune_parent_code: "75056", departement_nom: "Paris", region_nom: "Île-de-France"}
        - {commune_code: "75101", commune_type: ARM, commune_parent_code: "75056", departement_nom: "Paris", region_nom: "Île-de-France"}

  - name: test_dim_commune_coma_comd_exclus
    description: COMA et COMD sont exclus ; un code à la fois COM et COMD donne une seule ligne, celle du COM.
    model: dim_commune
    given:
      - input: ref('stg_insee__cog_communes')
        rows:
          - {cog_millesime: 2026, commune_code: "01015", commune_type: COM, commune_parent_code: null, commune_nom: "Arboys en Bugey", departement_code: "01", region_code: "84"}
          - {cog_millesime: 2026, commune_code: "01015", commune_type: COMD, commune_parent_code: "01015", commune_nom: "Arbignieu", departement_code: null, region_code: null}
          - {cog_millesime: 2026, commune_code: "01340", commune_type: COMA, commune_parent_code: "01015", commune_nom: "Saint-Bois", departement_code: null, region_code: null}
      - input: ref('stg_insee__cog_departements')
        rows:
          - {departement_code: "01", departement_nom: "Ain", region_code: "84"}
      - input: ref('stg_insee__cog_regions')
        rows:
          - {region_code: "84", region_nom: "Auvergne-Rhône-Alpes"}
      - input: ref('stg_insee__filosofi_communes')
        rows:
          - {filosofi_millesime: 2023, geo_object: COM, commune_code: "99998", med_sl: 1.0, med_sl_statut: A}
    expect:
      rows:
        - {commune_code: "01015", commune_type: COM, commune_nom: "Arboys en Bugey"}

  - name: test_dim_commune_filosofi_statut_c_valeur_nulle
    description: une ligne Filosofi en statut C (valeur masquée) donne une valeur NULL et garde le statut C ; une valeur publiée passe telle quelle.
    model: dim_commune
    given:
      - input: ref('stg_insee__cog_communes')
        rows:
          - {cog_millesime: 2026, commune_code: "01001", commune_type: COM, commune_parent_code: null, commune_nom: "L'Abergement-Clémenciat", departement_code: "01", region_code: "84"}
          - {cog_millesime: 2026, commune_code: "01004", commune_type: COM, commune_parent_code: null, commune_nom: "Ambérieu-en-Bugey", departement_code: "01", region_code: "84"}
      - input: ref('stg_insee__cog_departements')
        rows:
          - {departement_code: "01", departement_nom: "Ain", region_code: "84"}
      - input: ref('stg_insee__cog_regions')
        rows:
          - {region_code: "84", region_nom: "Auvergne-Rhône-Alpes"}
      - input: ref('stg_insee__filosofi_communes')
        rows:
          - {filosofi_millesime: 2023, geo_object: COM, commune_code: "01001", med_sl: 25000.0, med_sl_statut: A, pr_md60: null, pr_md60_statut: C}
          - {filosofi_millesime: 2023, geo_object: COM, commune_code: "01004", med_sl: null, med_sl_statut: C, pr_md60: 14.5, pr_md60_statut: A}
    expect:
      rows:
        - {commune_code: "01001", niveau_vie_median_eur: 25000.0, niveau_vie_median_statut: A, taux_pauvrete_pct: null, taux_pauvrete_statut: C}
        - {commune_code: "01004", niveau_vie_median_eur: null, niveau_vie_median_statut: C, taux_pauvrete_pct: 14.5, taux_pauvrete_statut: A}

  - name: test_dim_commune_filosofi_hors_cog_sans_ligne
    description: un code Filosofi absent du COG ne crée pas de ligne ; la commune présente reçoit sa valeur ; la jointure respecte geo_object.
    model: dim_commune
    given:
      - input: ref('stg_insee__cog_communes')
        rows:
          - {cog_millesime: 2026, commune_code: "01001", commune_type: COM, commune_parent_code: null, commune_nom: "L'Abergement-Clémenciat", departement_code: "01", region_code: "84"}
      - input: ref('stg_insee__cog_departements')
        rows:
          - {departement_code: "01", departement_nom: "Ain", region_code: "84"}
      - input: ref('stg_insee__cog_regions')
        rows:
          - {region_code: "84", region_nom: "Auvergne-Rhône-Alpes"}
      - input: ref('stg_insee__filosofi_communes')
        rows:
          - {filosofi_millesime: 2023, geo_object: COM, commune_code: "01001", med_sl: 25000.0, med_sl_statut: A}
          - {filosofi_millesime: 2023, geo_object: ARM, commune_code: "01001", med_sl: 1.0, med_sl_statut: A}
          - {filosofi_millesime: 2023, geo_object: COM, commune_code: "99999", med_sl: 30000.0, med_sl_statut: A}
    expect:
      rows:
        - {commune_code: "01001", niveau_vie_median_eur: 25000.0, filosofi_millesime: 2023}

  - name: test_dim_station_rupture_seule_sans_version
    description: deux lignes qui ne diffèrent que par ruptures_json (etat_hash différent) donnent une seule version.
    model: dim_station
    given:
      - input: ref('stg_carburants__station_etats')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-16 10:00:00", etat_hash: h1, adresse: "1 rue A", ruptures_json: null}
          - {station_id: 1, collecte_ts: "2026-11-16 10:15:00", etat_hash: h2, adresse: "1 rue A", ruptures_json: '[{"nom":"Gazole"}]'}
    expect:
      rows:
        - {station_id: 1, version_num: 1, debut_validite_ts: "2026-11-16 10:00:00", fin_validite_ts: null, est_courante: true}

  - name: test_dim_station_a_b_a_trois_versions
    description: A, puis B, puis A donnent trois versions (retour à une valeur antérieure, cas du 05/11).
    model: dim_station
    given:
      - input: ref('stg_carburants__station_etats')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-05 08:00:00", etat_hash: h1, adresse: "1 rue A"}
          - {station_id: 1, collecte_ts: "2026-11-05 09:00:00", etat_hash: h2, adresse: "2 rue B"}
          - {station_id: 1, collecte_ts: "2026-11-05 10:00:00", etat_hash: h3, adresse: "1 rue A"}
    expect:
      rows:
        - {station_id: 1, version_num: 1, adresse: "1 rue A", debut_validite_ts: "2026-11-05 08:00:00"}
        - {station_id: 1, version_num: 2, adresse: "2 rue B", debut_validite_ts: "2026-11-05 09:00:00"}
        - {station_id: 1, version_num: 3, adresse: "1 rue A", debut_validite_ts: "2026-11-05 10:00:00"}

  - name: test_dim_station_services_reordonnes_sans_version
    description: services réordonné seul (etat_hash différent) ne crée pas de version.
    model: dim_station
    given:
      - input: ref('stg_carburants__station_etats')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-05 08:00:00", etat_hash: h1, adresse: "1 rue A", services_json: '["Boutique","Toilettes"]'}
          - {station_id: 1, collecte_ts: "2026-11-05 09:00:00", etat_hash: h2, adresse: "1 rue A", services_json: '["Toilettes","Boutique"]'}
    expect:
      rows:
        - {station_id: 1, version_num: 1, debut_validite_ts: "2026-11-05 08:00:00", est_courante: true}

  - name: test_dim_station_bornes_contigues_par_station
    description: >
      la version précédente se termine exactement au début de la suivante ; la dernière de chaque station a
      fin_validite_ts NULL et est_courante vrai, même quand une autre station a une observation plus tardive.
    model: dim_station
    given:
      - input: ref('stg_carburants__station_etats')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-05 08:00:00", etat_hash: h1, adresse: "1 rue A"}
          - {station_id: 1, collecte_ts: "2026-11-05 09:00:00", etat_hash: h2, adresse: "2 rue B"}
          - {station_id: 2, collecte_ts: "2026-11-05 10:00:00", etat_hash: h3, adresse: "3 rue C"}
    expect:
      rows:
        - {station_id: 1, version_num: 1, debut_validite_ts: "2026-11-05 08:00:00", fin_validite_ts: "2026-11-05 09:00:00", est_courante: false}
        - {station_id: 1, version_num: 2, debut_validite_ts: "2026-11-05 09:00:00", fin_validite_ts: null, est_courante: true}
        - {station_id: 2, version_num: 1, debut_validite_ts: "2026-11-05 10:00:00", fin_validite_ts: null, est_courante: true}

  - name: test_dim_station_ligne_unique_version_courante
    description: une station à une seule ligne donne une version courante, version_num 1.
    model: dim_station
    given:
      - input: ref('stg_carburants__station_etats')
        rows:
          - {station_id: 7, collecte_ts: "2026-11-16 10:00:00", etat_hash: h1, adresse: "7 rue G", charge_ts: "2026-11-16 12:20:31"}
    expect:
      rows:
        - {station_id: 7, version_num: 1, adresse: "7 rue G", debut_validite_ts: "2026-11-16 10:00:00", fin_validite_ts: null, est_courante: true, charge_ts: "2026-11-16 12:20:31"}

  - name: test_fct_ruptures_trois_versions_un_evenement
    description: une rupture vue sur trois versions de la station donne un seul événement, de la première à la dernière observation.
    model: fct_ruptures
    given:
      - input: ref('int_ruptures__observations')
        format: sql
        rows: |
          select cast(1 as bigint) as station_id, timestamp '2026-11-20 08:00:00' as collecte_ts, 'gazole' as carburant, timestamp '2026-11-20 07:50:00' as rupture_debut_ts, 'temporaire' as rupture_type
          union all select cast(1 as bigint), timestamp '2026-11-20 09:00:00', 'gazole', timestamp '2026-11-20 07:50:00', 'temporaire'
          union all select cast(1 as bigint), timestamp '2026-11-20 10:00:00', 'gazole', timestamp '2026-11-20 07:50:00', 'temporaire'
      - input: ref('stg_carburants__station_etats')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-20 08:00:00"}
          - {station_id: 1, collecte_ts: "2026-11-20 09:00:00"}
          - {station_id: 1, collecte_ts: "2026-11-20 10:00:00"}
      - input: ref('int_stations__commune')
        rows:
          - {station_id: 1, commune_code: "01001"}
    expect:
      rows:
        - {station_id: 1, carburant: gazole, rupture_debut_ts: "2026-11-20 07:50:00", rupture_type: temporaire, premiere_observation_ts: "2026-11-20 08:00:00", derniere_observation_ts: "2026-11-20 10:00:00", commune_code: "01001"}

  - name: test_fct_ruptures_fin_premiere_version_sans_l_evenement
    description: >
      la fin observée est le collecte_ts de la première version de la station où l'événement a disparu, pas la
      dernière observation ni une version plus tardive ; une version d'une autre station ne compte pas.
    model: fct_ruptures
    given:
      - input: ref('int_ruptures__observations')
        format: sql
        rows: |
          select cast(1 as bigint) as station_id, timestamp '2026-11-20 08:00:00' as collecte_ts, 'sp98' as carburant, timestamp '2026-11-20 07:00:00' as rupture_debut_ts, 'temporaire' as rupture_type
          union all select cast(1 as bigint), timestamp '2026-11-20 09:00:00', 'sp98', timestamp '2026-11-20 07:00:00', 'temporaire'
      - input: ref('stg_carburants__station_etats')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-20 08:00:00"}
          - {station_id: 1, collecte_ts: "2026-11-20 09:00:00"}
          - {station_id: 2, collecte_ts: "2026-11-20 09:30:00"}
          - {station_id: 1, collecte_ts: "2026-11-20 10:00:00"}
