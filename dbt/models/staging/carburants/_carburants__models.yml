      - name: fichier_source
        description: Fichier Parquet chargé dans le bronze (traçabilité).
      - name: charge_ts
        description: Heure du chargement dans le bronze (traçabilité, hors freshness).

  - name: stg_carburants__station_communes
    description: Rattachement des stations à une commune ou un arrondissement (com_arm_code du flux quotidien), une ligne par station.
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: commune_arm_code
        description: Code INSEE de commune ou d'arrondissement municipal ; NULL si le quotidien n'en donne pas.
      - name: fichier_date
        description: Jour UTC du dernier prix_maj du fichier quotidien chargé.
        data_tests: [not_null]
      - name: postgres_charge_ts
        description: Heure du chargement dans la base de collecte (Postgres).
        data_tests: [not_null]
      - name: charge_ts
        description: Heure du chargement dans le bronze (traçabilité, hors freshness).
        data_tests: [not_null]

unit_tests:
  - name: test_prix_maj_ts_identique_a_maj
    description: maj passe telle quelle dans prix_maj_ts (aucune conversion de fuseau) ; renommage et type du prix.
    model: stg_carburants__prix
    given:
      - input: source('carburant_bronze', 'prix_flux')
        rows:
          - {station_id: 1000001, carburant: gazole, maj: "2026-11-16 10:19:44", prix: 1.789, collecte_ts: "2026-11-16 10:30:03", _fichier_source: "dbfs:/f1.parquet", _charge_ts: "2026-11-16 12:20:31"}
          - {station_id: 1000002, carburant: e85, maj: "2026-03-29 01:30:00", prix: 0.659, collecte_ts: "2026-03-29 02:15:00", _fichier_source: "dbfs:/f2.parquet", _charge_ts: "2026-03-30 12:20:31"}
    expect:
      rows:
        - {station_id: 1000001, carburant: gazole, prix_maj_ts: "2026-11-16 10:19:44", prix_eur_litre: 1.789, collecte_ts: "2026-11-16 10:30:03", fichier_source: "dbfs:/f1.parquet", charge_ts: "2026-11-16 12:20:31"}
        - {station_id: 1000002, carburant: e85, prix_maj_ts: "2026-03-29 01:30:00", prix_eur_litre: 0.659, collecte_ts: "2026-03-29 02:15:00", fichier_source: "dbfs:/f2.parquet", charge_ts: "2026-03-30 12:20:31"}
  - name: test_rupture_debut_heure_de_paris_convertie_en_utc
    description: >
      <carburant>_rupture_debut est étiqueté +00:00 mais exprimé en heure de Paris (J8-M4c) : l'étiquette est ignorée,
      l'heure de Paris convertie en UTC. Été et hiver ; heures ambiguë (25/10, heure d'été retenue) et inexistante
      (29/03, décalée de la durée du saut) figées sur le comportement mesuré de Databricks le 23/11.
    model: stg_carburants__station_etats
    given:
      - input: source('carburant_bronze', 'station_etat_flux')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-23 10:00:00", etat_hash: h1, etat: '{"gazole_rupture_debut": "2026-03-29T03:30:00+00:00", "gazole_rupture_type": "temporaire"}'}
          - {station_id: 2, collecte_ts: "2026-11-23 10:00:00", etat_hash: h2, etat: '{"gazole_rupture_debut": "2026-11-20T10:00:00+00:00", "gazole_rupture_type": "definitive"}'}
          - {station_id: 3, collecte_ts: "2026-11-23 10:00:00", etat_hash: h3, etat: '{"gazole_rupture_debut": "2026-10-25T02:30:00+00:00", "gazole_rupture_type": "temporaire"}'}
          - {station_id: 4, collecte_ts: "2026-11-23 10:00:00", etat_hash: h4, etat: '{"gazole_rupture_debut": "2026-03-29T02:30:00+00:00", "gazole_rupture_type": "temporaire"}'}
    expect:
      rows:
        - {station_id: 1, gazole_rupture_debut_ts: "2026-03-29 01:30:00", gazole_rupture_type: temporaire}
        - {station_id: 2, gazole_rupture_debut_ts: "2026-11-20 09:00:00", gazole_rupture_type: definitive}
        - {station_id: 3, gazole_rupture_debut_ts: "2026-10-25 00:30:00", gazole_rupture_type: temporaire}
        - {station_id: 4, gazole_rupture_debut_ts: "2026-03-29 01:30:00", gazole_rupture_type: temporaire}

  - name: test_coordonnees_divisees_par_100000
    description: latitude et longitude de la source sont des chaînes multipliées par 100 000, entières ou décimales ; une valeur non numérique donne NULL (try_cast).
    model: stg_carburants__station_etats
    given:
      - input: source('carburant_bronze', 'station_etat_flux')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-16 10:00:00", etat_hash: h1, etat: '{"latitude": "4139100", "longitude": "915000"}'}
          - {station_id: 2, collecte_ts: "2026-11-16 10:00:00", etat_hash: h2, etat: '{"latitude": "4620788.7144338", "longitude": "523712.13755033"}'}
          - {station_id: 3, collecte_ts: "2026-11-16 10:00:00", etat_hash: h3, etat: '{"latitude": "abc", "longitude": "-10000"}'}
    expect:
      rows:
        - {station_id: 1, latitude: 41.391, longitude: 9.15}
        - {station_id: 2, latitude: 46.207887144338, longitude: 5.237121375503301}
        - {station_id: 3, latitude: null, longitude: -0.1}

  - name: test_automate_24_24_comparaison_exacte
    description: Oui donne true, Non donne false ; toute autre valeur (oui en minuscules, NULL) donne NULL.
    model: stg_carburants__station_etats
    given:
      - input: source('carburant_bronze', 'station_etat_flux')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-16 10:00:00", etat_hash: h1, etat: '{"horaires_automate_24_24": "Oui"}'}
          - {station_id: 2, collecte_ts: "2026-11-16 10:00:00", etat_hash: h2, etat: '{"horaires_automate_24_24": "Non"}'}
          - {station_id: 3, collecte_ts: "2026-11-16 10:00:00", etat_hash: h3, etat: '{"horaires_automate_24_24": "oui"}'}
          - {station_id: 4, collecte_ts: "2026-11-16 10:00:00", etat_hash: h4, etat: '{"horaires_automate_24_24": null}'}
    expect:
      rows:
        - {station_id: 1, automate_24_24: true}
        - {station_id: 2, automate_24_24: false}
        - {station_id: 3, automate_24_24: null}
        - {station_id: 4, automate_24_24: null}

  - name: test_cle_absente_donne_null
    description: une clé absente du JSON donne une colonne à NULL, sans erreur ; les clés présentes sont extraites.
    model: stg_carburants__station_etats
    given:
      - input: source('carburant_bronze', 'station_etat_flux')
        rows:
          - {station_id: 1, collecte_ts: "2026-11-16 10:00:00", etat_hash: h1, etat: '{"adresse": "1 rue de la Gare", "cp": "01000"}'}
    expect:
      rows:
        - {station_id: 1, adresse: "1 rue de la Gare", code_postal: "01000", ville: null, code_departement: null, latitude: null, longitude: null, type_route_code: null, automate_24_24: null, services_json: null, ruptures_json: null}
