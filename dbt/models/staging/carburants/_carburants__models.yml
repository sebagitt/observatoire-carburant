          concernée au 23/11 (mesure J8, témoin vérifié).
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.37   # D3b, 75,5784 % au 23/11 (J8-M1)
              config:
                severity: error
      - name: gplc_rupture_type
        data_tests:
          - accepted_values:
              arguments:
                values: [definitive, temporaire]
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.37   # D3b, 75,5784 % au 23/11 (J8-M1)
