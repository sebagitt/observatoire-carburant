version: 2

models:
  - name: stg_carburants__prix
    description: Prix du bronze renommés et typés. Une ligne par (station, carburant, maj). Horodatages en UTC.
    columns:
      - name: prix_id
        description: Clé de substitution (station_id, carburant, maj).
        data_tests: [unique, not_null]
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_carburants__station_etats')
                field: station_id
              config:
                severity: warn
      - name: carburant
        description: Valeurs mesurées le 16/11, en minuscules (aucune normalisation).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [gazole, e10, sp98, e85, sp95, gplc]
      - name: prix_maj_ts
        description: maj de la source, UTC, sans conversion de fuseau.
        data_tests: [not_null]
      - name: prix_eur_litre
        description: Prix en euros par litre, DECIMAL(6,3).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              name: prix_eur_litre_strictement_positif
              arguments:
                min_value: 0
                inclusive: false
          - dbt_utils.accepted_range:
              name: prix_eur_litre_plausible
              arguments:
                min_value: 0.5
                max_value: 3.5
              config:
                severity: warn
      - name: collecte_ts
        description: Heure du passage de collecte, UTC.
        data_tests: [not_null]
      - name: fichier_source
        description: Fichier Parquet chargé dans le bronze (traçabilité).
      - name: charge_ts
        description: Heure du chargement dans le bronze (traçabilité, hors freshness).
    data_tests:
      - dbt_utils.expression_is_true:
          name: prix_maj_avant_collecte
          arguments:
            expression: "prix_maj_ts <= collecte_ts"
          config:
            severity: warn

  - name: stg_carburants__station_etats
    description: Versions d'état des stations, une ligne par (station, collecte_ts), champs du JSON etat extraits et typés. Horodatages en UTC.
    columns:
      - name: station_etat_id
        description: Clé de substitution (station_id, collecte_ts).
        data_tests: [unique, not_null]
      - name: station_id
        data_tests: [not_null]
      - name: collecte_ts
        description: Heure du passage de collecte où l'état a changé, UTC.
        data_tests: [not_null]
      - name: etat_hash
        data_tests: [not_null]
      # Filet de taux de non-NULL (J7) : une clé JSON mal écrite ou disparue donne 0 % (get_json_object).
      # D3 : taux mesuré au STOP 0 du 19/11 moins 1 point, au millième inférieur.
      # D3b (colonnes volatiles, leur taux suit l'état des stations) : moitié du taux mesuré, au centième inférieur.
      - name: adresse
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.99   # D3, 100,0000 % au 19/11
              config:
                severity: error
      - name: code_postal
        description: Clé cp, chaîne (zéro de tête gardé).
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.99   # D3, 100,0000 % au 19/11
              config:
                severity: error
      - name: ville
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.988   # D3, 99,8931 % au 19/11
              config:
                severity: error
      - name: code_departement
        description: versions anciennes de quelques stations sans département ; nombre suivi par le test not_null en warn (34 lignes au 19/11)
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.988   # D3, 99,8931 % au 19/11
              config:
                severity: error
      - name: departement_nom
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.988   # D3, 99,8931 % au 19/11
              config:
                severity: error
      - name: code_region
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.988   # D3, 99,8931 % au 19/11
              config:
                severity: error
      - name: region_nom
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.988   # D3, 99,8931 % au 19/11
              config:
                severity: error
      - name: latitude
        description: Clé latitude divisée par 100 000 (chaîne entière ou décimale), en degrés ; égale à geom.lat (écart 0 mesuré).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              name: latitude_metropole_corse
              arguments:
                min_value: 41.0
                max_value: 51.5
              config:
                severity: warn
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.99   # D3, 100,0000 % au 19/11
              config:
                severity: error
      - name: longitude
        description: Clé longitude divisée par 100 000, en degrés.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              name: longitude_metropole_corse
              arguments:
                min_value: -5.5
                max_value: 10.0
              config:
                severity: warn
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.99   # D3, 100,0000 % au 19/11
              config:
                severity: error
      - name: type_route_code
        description: Clé pop. A autoroute, R route (hypothèse, non vu dans la documentation).
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.99   # D3, 100,0000 % au 19/11
              config:
                severity: error
      - name: automate_24_24
        description: Clé horaires_automate_24_24 ; Oui donne true, Non donne false, toute autre valeur NULL.
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.99   # D3, 100,0000 % au 19/11
              config:
                severity: error
      - name: horaires_json
        description: JSON brut des horaires (exploité en J7).
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.43   # D3b, 87,0845 % au 19/11
              config:
                severity: error
      - name: services_json
        description: Liste JSON brute des services (clé services_service).
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.46   # D3b, 93,3992 % au 19/11
              config:
                severity: error
      - name: ruptures_json
        description: JSON brut des ruptures (12 colonnes typées en J7).
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.48   # D3b, 96,2389 % au 19/11
              config:
                severity: error
      - name: carburants_disponibles_json
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.45   # D3b, 90,6852 % au 19/11
              config:
                severity: error
      - name: carburants_indisponibles_json
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.45   # D3b, 90,0374 % au 19/11
              config:
                severity: error
      - name: carburants_rupture_definitive_liste
        description: Liste brute, séparateur point-virgule.
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.39   # D3b, 78,1503 % au 19/11
              config:
                severity: error
      - name: carburants_rupture_temporaire_liste
        description: Liste brute, séparateur point-virgule.
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.27   # D3b, 54,1181 % au 19/11
              config:
                severity: error
      - name: e10_rupture_debut_ts
        description: >
          Début de la rupture de e10, en UTC : la source l'étiquette +00:00 mais l'exprime en heure de Paris (J8-M4c),
          l'étiquette est ignorée et l'heure de Paris convertie (to_utc_timestamp). Limite : une heure ambiguë (passage
          à l'heure d'hiver) est lue en heure d'été ; une heure inexistante (passage à l'heure d'été) est décalée de la
          durée du saut (02:30 donne 01:30 UTC), alors que maj des prix l'avance à 03:00 (shift_forward). 0 valeur
          concernée au 23/11 (mesure J8, témoin vérifié).
        data_tests:
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.17   # D3b, 34,3331 % au 23/11 (J8-M1)
              config:
                severity: error
      - name: e10_rupture_type
        data_tests:
          - accepted_values:
              arguments:
                values: [definitive, temporaire]
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.17   # D3b, 34,3331 % au 23/11 (J8-M1)
              config:
                severity: error
      - name: e85_rupture_debut_ts
        description: >
          Début de la rupture de e85, en UTC : la source l'étiquette +00:00 mais l'exprime en heure de Paris (J8-M4c),
